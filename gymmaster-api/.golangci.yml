version: "2"
run:
  timeout: 5m
linters:
  enable:
    - bodyclose
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - gosec
  settings:
    gosec:
      excludes:
        - G115 # chuyển đổi số nguyên an toàn trong ngữ cảnh id
formatters:
  enable:
    - gofmt
    - goimports
