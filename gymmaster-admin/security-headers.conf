# Header bảo mật cho admin SPA – được include trong MỌI location của nginx.conf
# (nginx không kế thừa add_header của server{} khi location có add_header riêng).
# __API_ORIGIN__ được Dockerfile thay bằng origin của VITE_API_URL lúc build (vd http://localhost:8000).
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
# CSP:
#  - script-src: chỉ bundle của Vite + hash của script in tự động trong cửa sổ in phiếu kho
#    (src/routes/inventory/printVoucher.ts – nếu sửa script đó phải cập nhật lại hash).
#  - style-src 'unsafe-inline': antd dùng CSS-in-JS chèn thẻ <style> lúc chạy.
#  - connect-src/img-src: API (REST + SSE thông báo, ảnh upload) ở origin riêng.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-u3Rra+FChRQHac/VQhvVRynxLoCzDTLQfM9/oewh+xM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https: __API_ORIGIN__; connect-src 'self' __API_ORIGIN__; frame-src 'self' __API_ORIGIN__; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
