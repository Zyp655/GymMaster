name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gymmaster-api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: gymmaster
          POSTGRES_PASSWORD: gymmaster
          POSTGRES_DB: gymmaster
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U gymmaster" --health-interval 5s --health-retries 10
    env:
      JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: gymmaster-api/go.mod
          cache-dependency-path: gymmaster-api/go.sum
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          working-directory: gymmaster-api
      - name: Migrate (kiểm tra up/down/up)
        run: go run . migrate up && go run . migrate down 99 && go run . migrate up && go run . seed
      - name: Test
        run: go test ./... -race -count=1
      - name: Build
        run: go build ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gymmaster-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gymmaster-web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          NEXTAUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret

  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gymmaster-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gymmaster-admin/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint
      - run: npm run build

